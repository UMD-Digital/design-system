# .github/workflows/auto-release.yml
name: Automated Release

# All packages share one version (2.0+ release philosophy). Every release
# publishes every package at that version, whether or not it changed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for every package (e.g. 2.2.0 or 2.2.0-alpha.1)'
        required: true
        type: string
      tag:
        description: 'npm dist-tag (e.g. alpha)'
        required: false
        type: string
        default: 'latest'
      dry_run:
        description: 'Dry run (build, test, and simulate publishing without releasing)'
        required: false
        type: boolean
        default: true

# Prevent concurrent releases
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC); replaces NPM_TOKEN and 2FA prompts
  id-token: write

env:
  DRY_RUN: ${{ inputs.dry_run }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
      published: ${{ steps.publish.outputs.published }}
      dry_run: ${{ env.DRY_RUN }}

    steps:
      # Runs first so bad inputs fail before any build or test time is spent
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_NAME" != "npm-release" ]; then
            echo "::error::Releases must run from npm-release, not $GITHUB_REF_NAME"
            exit 1
          fi

          # Exact version check
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a valid version (e.g. 2.2.0 or 2.2.0-alpha.1)"
            exit 1
          fi

          # A pre-release on latest would become the default install for everyone
          if [[ "$VERSION" == *-* ]] && [ "$DIST_TAG" = "latest" ]; then
            echo "::error::$VERSION is a pre-release; set the tag input (e.g. alpha) instead of latest"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "ds-release-gh-workflow[bot]"
          git config user.email "ds-release-gh-workflow[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@^12.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages in dependency order
        run: |
          PACKAGES=$(pnpm exec lerna list --toposort --json | jq -r '.[] | "\(.name) \(.location)"')

          while read -r name location; do
            (cd "$location" && pnpm run build && pnpm run --if-present build:css)
          done <<< "$PACKAGES"

      - name: Generate mocks for testing
        run: pnpm run generate:mocks

      - name: Run tests
        run: pnpm exec lerna run test --stream

      - name: Bump package versions
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm -r --include-workspace-root exec pnpm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Update package badges
        run: pnpm run update-badges

      - name: Publish to npm
        id: publish
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.tag }}
        run: |
          PUBLISHED=()

          PACKAGES=$(pnpm exec lerna list --toposort --json | jq -r '.[] | "\(.name) \(.location)"')

          while read -r name location; do
            if npm view "$name@$VERSION" version; then
              echo "⏭️  $name@$VERSION already on npm"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "🧪 Would publish $name@$VERSION ($DIST_TAG)"
              (cd "$location" && pnpm publish --tag "$DIST_TAG" --dry-run --no-git-checks)
            else
              (cd "$location" && pnpm publish --tag "$DIST_TAG" --no-git-checks)
              echo "✅ Published $name@$VERSION ($DIST_TAG)"
            fi

            PUBLISHED+=("$name@$VERSION")
          done <<< "$PACKAGES"

          echo "published=$(echo "${PUBLISHED[*]}")" >> "$GITHUB_OUTPUT"

      # Commits after publishing, so a failed publish never leaves a version bump on the branch
      - name: Commit version and badges
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add README.md package.json packages/*/README.md packages/*/package.json
          if git diff --cached --quiet; then
            echo "ℹ️  No version or badge changes to commit"
            exit 0
          fi
          git commit -m "Release (Workflow): version $VERSION"

          # Packages are already on npm here; rebase in case npm-release moved during the run
          if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME" || ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::error::$VERSION is on npm, but the version bump could not be pushed to $GITHUB_REF_NAME. Rerun the workflow or commit the bump by hand."
            exit 1
          fi

      - name: Tag and draft release
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="release-v$VERSION"

          git tag "$TAG"
          git push origin "$TAG"

          # Pre-releases are marked so they don't show as "Latest" on GitHub
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=("--prerelease")
          fi

          gh release create "$TAG" --draft --verify-tag --title "Release $VERSION" --notes "" "${RELEASE_FLAGS[@]}"

  notify:
    name: Send Notifications
    needs: release
    if: always() && needs.release.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-notification.yml
    with:
      status: ${{ needs.release.result == 'success' && 'success' || 'failure' }}
      version_bump: ${{ needs.release.outputs.version }}
      package_version: ${{ needs.release.outputs.version }}
      packages_changed: ${{ needs.release.outputs.published || 'none' }}
      error_message: ${{ needs.release.result == 'failure' && 'Release failed. Check workflow logs.' || '' }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
