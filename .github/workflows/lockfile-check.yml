# .github/workflows/lockfile-check.yml
name: Lockfile Check

# Release workflows install with --frozen-lockfile, so a lockfile that has
# drifted from package.json only fails at release time. Catch it on the PR.
on:
  pull_request:
    branches:
      - main
      - 'patch/**'
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: lockfile-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frozen-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
