# .github/workflows/pr-checks.yml
name: PR Checks

# Checks:
# 1. Lockfile matches package.json (frozen install, as releases use)
# 2. Changed files pass Prettier (fix: pnpm exec prettier --write)
# 3. Tests pass (pnpm test)
on:
  pull_request:
    branches:
      - main
      - 'patch/**'
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm must be on PATH before setup-node can cache its store
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check formatting of changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        # Uses the lint-staged config in package.json, same as the pre-commit hook
        run: |
          pnpm exec lint-staged --diff="origin/$BASE_REF...HEAD" --fail-on-changes || {
            echo "::error::Not formatted. Fix with: pnpm exec prettier --write <files>"
            git diff --name-only
            exit 1
          }

      # Runs even if formatting failed, so both results show in one run
      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
